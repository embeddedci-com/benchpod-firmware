# Version updates for the workflow actions (weekly), the vendored git submodules (monthly; each
# bump needs a build and a bench run before it merges) and the calibration scripts' Python
# requirements (monthly). Security updates arrive on their own. Full list: docs/DEPENDENCIES.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    ignore:
      # CMSIS core moves with the HAL it was released with (STM32CubeH5 v1.6.0 ships Core 5.6):
      # bump it by hand in the same change as the HAL (docs/DEPENDENCIES.md).
      - dependency-name: "stm32h563/lib/stm32cube/cmsis_core"
  - package-ecosystem: pip
    directory: /calibration/scripts
    schedule:
      interval: monthly
