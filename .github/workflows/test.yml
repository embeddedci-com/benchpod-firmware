# Run the firmware test suites on every PR and push to main so a broken test (or a stale
# generated protocol file) is caught before a release tag is cut. The release
# workflow (release-stm32.yml) calls this one and publishes only when it passed.
#
#   • ice40 gateware sims  — `make -C ice40 test` (iverilog/vvp/yosys) + the
#     tools/gen_protocol.py --check the target already runs.
#   • stm32h563 host tests — `make -C stm32h563/test` (native cc, no toolchain).
#   • motor-emulator gateware (ECP5) — `make -C motor-emulator/ecp5 test-rtl all` (every RTL
#     bench, then synthesis, place and route at 36 MHz) and `test-gl` (the same benches on the
#     yosys gate-level netlist). The gate-level benches run as a matrix, one job per bench in
#     BENCHES_GL (the `changes` job reads the list from motor-emulator/ecp5/Makefile), so the run
#     takes as long as its slowest bench (tb_top_gl, most of the time) instead of the sum on
#     four cores; the motor-emulator-gl job sums up the matrix.
#
# Triggers: pull requests, pushes to main, a nightly run, manual runs (workflow_dispatch) and the
# release workflow (workflow_call with release: true), which waits for these jobs before it
# publishes anything. A push to a PR branch used to run everything twice (push + pull_request);
# branches other than main now get the pull_request run only.
#
# Path gating, pull requests only: the `changes` job lists the files a PR changes. ice40-sim
# runs only when what `make -C ice40 test` reads changed: ice40/, tools/gen_protocol.py and the
# stm32h563 headers it generates (the --check compares them), tools/ice40_release.py and its
# test, or this workflow. stm32-host runs only when stm32h563/, esp32-hosted-slave/, .gitmodules
# or this workflow changed. The motor-emulator jobs run only when motor-emulator/ or this
# workflow changed. A push to main (a merge), the nightly and manual runs and the release always
# run everything, and so does any other event, a base commit that cannot be fetched or a failed
# `changes` job. A job skipped by its `if` reports success, so a required check (ice40-sim,
# stm32-host) stays green.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * *'   # nightly, after the 02:17 UTC HIL run (embeddedci-server hil.yml)
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Called by the release workflow: stale ice40/release/ images fail, the motor-emulator jobs are skipped"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ice40: ${{ steps.filter.outputs.ice40 }}
      stm32: ${{ steps.filter.outputs.stm32 }}
      motor: ${{ steps.filter.outputs.motor }}
      gl_benches: ${{ steps.benches.outputs.gl_benches }}
    steps:
      - name: Checkout (tree only, for the diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            motor-emulator/ecp5
      - name: Gate-level bench list (BENCHES_GL in motor-emulator/ecp5/Makefile)
        id: benches
        run: |
          benches=$(sed -n 's/^BENCHES_GL *= *//p' motor-emulator/ecp5/Makefile | jq -Rc 'split(" ") | map(select(length > 0))')
          echo "gl_benches=$benches"
          if [ "$benches" = "[]" ] || [ -z "$benches" ]; then echo "::error::no BENCHES_GL in motor-emulator/ecp5/Makefile"; exit 1; fi
          echo "gl_benches=$benches" >> "$GITHUB_OUTPUT"
      - name: Which suites does this change need?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release && 'true' || 'false' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all() {
            echo "$1: run every suite"
            echo "ice40=true" >> "$GITHUB_OUTPUT"
            echo "stm32=true" >> "$GITHUB_OUTPUT"
            echo "motor=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$RELEASE" = true ]; then all "release"; fi
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            *) all "event $EVENT" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then all "no base commit"; fi
          if ! git fetch -q --depth=1 --filter=blob:none origin "$base"; then all "base $base not fetchable"; fi
          changed=$(git diff --name-only --no-renames "$base" HEAD)
          echo "changed files:"; sed 's/^/  /' <<< "$changed"
          match() { if grep -Eq "$1" <<< "$changed"; then echo true; else echo false; fi; }
          ice40=$(match '^(ice40/|tools/(gen_protocol|ice40_release|test_ice40_release)\.py$|stm32h563/src/(cmd_opcodes|fpga_config)\.h$|\.github/workflows/test\.yml$)')
          stm32=$(match '^(stm32h563/|esp32-hosted-slave/|\.gitmodules$|\.github/workflows/test\.yml$)')
          motor=$(match '^(motor-emulator/|\.github/workflows/test\.yml$)')
          echo "ice40=$ice40 stm32=$stm32 motor=$motor"
          echo "ice40=$ice40" >> "$GITHUB_OUTPUT"
          echo "stm32=$stm32" >> "$GITHUB_OUTPUT"
          echo "motor=$motor" >> "$GITHUB_OUTPUT"

  ice40-sim:
    # a required check: skipped by this `if` it reports success; runs when `changes` failed
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ice40 != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OSS CAD Suite (yosys / nextpnr-ice40 / icestorm / iverilog)
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0
        with:
          # Authenticated release lookups: the anonymous API limit is shared per runner IP and the
          # gate-level matrix runs this step once per bench.
          github-token: ${{ github.token }}
          # PIN yosys/nextpnr to the 0.65 toolchain the design is validated on. yosys 0.66's
          # abc9 change places the up5k ~7 MHz worse (docs / ice40 LUT-optimization notes), which
          # dropped the razor-thin deep-DAC-replay image's clk48 below 48 MHz on the drifting
          # `latest` OSS CAD Suite. 2026-05-13 is the first build after yosys 0.65 (2026-05-12).
          version: '2026-05-13'
      - name: Toolchain versions (confirm the 0.65 pin)
        run: yosys --version && nextpnr-ice40 --version
      - name: Run gateware testbenches + protocol check
        # `test` also places both runtime images (multiboot), always with PNR_STRICT=1: a fallback
        # seed, a thin clk48, a slow clk -> clk48 path or a log without those lines fails the job
        # (ice40/Makefile).  It used to come from the ICE40_PNR_STRICT repository variable with a
        # default of 0, so a missing variable (a fork, a renamed variable) turned the gate off.
        # This runner's toolchain places differently from a local one, so seeds are pinned from
        # sweeps in both (the ice40-seed-sweep workflow).
        run: make -C ice40 test PNR_STRICT=1
      # Releases embed ice40/release/ (hardware-verified), not the images built above.  Every
      # gateware change is unpromoted until it has been tested on a bench, so on a PR or main this
      # only warns; called by the release workflow it fails.
      - name: Hardware-verified release images match the sources
        env:
          RELEASE: ${{ inputs.release && '1' || '0' }}
        run: |
          if make -C ice40 check-release; then exit 0; fi
          if [ "$RELEASE" = 1 ]; then
            echo "::error title=ice40 release images stale::ice40/release/ does not match the gateware sources: test this gateware on hardware, run make -C ice40 promote and commit ice40/release/ before tagging."
            exit 1
          fi
          echo "::warning title=ice40 release images stale::ice40/release/ does not match the gateware sources. Test this gateware on hardware, then run make -C ice40 promote and commit ice40/release/ before tagging a firmware release."

  stm32-host:
    # a required check: skipped by this `if` it reports success; runs when `changes` failed
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stm32 != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules — host tests include esp_hosted headers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Run STM32H563 host unit tests
        run: make -C stm32h563/test

  motor-emulator-sim:
    # not part of a firmware release; runs when motor-emulator/ changed (or `changes` failed)
    needs: changes
    if: ${{ !cancelled() && !inputs.release && needs.changes.outputs.motor != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OSS CAD Suite (yosys / nextpnr-ecp5 / prjtrellis / iverilog)
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0
        with:
          # Authenticated release lookups: the anonymous API limit is shared per runner IP and the
          # gate-level matrix runs this step once per bench.
          github-token: ${{ github.token }}
          version: '2026-05-13'
      - name: RTL benches
        run: make -C motor-emulator/ecp5 test-rtl YOSYS=yosys
      # nextpnr fails the step when the 36 MHz clock constraint is not met
      - name: Synthesis, place and route, bitstream
        run: make -C motor-emulator/ecp5 all YOSYS=yosys NEXTPNR=nextpnr-ecp5 ECPPACK=ecppack
      - name: Keep the bitstream
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motor-emulator-bitstream
          path: |
            motor-emulator/ecp5/build/motor_emulator.bit
            motor-emulator/ecp5/build/nextpnr.log
          if-no-files-found: error

  motor-emulator-gl-bench:
    name: motor-emulator-gl (${{ matrix.bench }})
    needs: changes
    if: ${{ !cancelled() && !inputs.release && needs.changes.outputs.motor != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJSON(needs.changes.outputs.gl_benches) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OSS CAD Suite (yosys / iverilog)
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0
        with:
          # Authenticated release lookups: the anonymous API limit is shared per runner IP and the
          # gate-level matrix runs this step once per bench.
          github-token: ${{ github.token }}
          version: '2026-05-13'
      - name: Gate-level bench ${{ matrix.bench }}
        env:
          BENCH: ${{ matrix.bench }}
        run: make -C motor-emulator/ecp5 -j"$(nproc)" "$BENCH" YOSYS=yosys

  # one status for the whole matrix (skipped benches count as passed)
  motor-emulator-gl:
    needs: motor-emulator-gl-bench
    if: ${{ !cancelled() && !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate-level bench passed
        env:
          RESULT: ${{ needs.motor-emulator-gl-bench.result }}
        run: |
          echo "gate-level benches: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]
