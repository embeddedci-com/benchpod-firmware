# Build the STM32H563 bench-pod firmware and publish the binary as a GitHub
# release on this repo, so `benchpod flash-self` can fetch a prebuilt image
# without anyone needing a toolchain.
#
# Trigger: push a tag like `stm32-v0.0.6` (the `stm32-` prefix is stripped for
# the release tag, e.g. → `v0.0.6`), or run it manually with an explicit tag
# via workflow_dispatch. The build embeds the HARDWARE-VERIFIED iCE40 images committed in
# ice40/release/ (not a build from this job: CI's toolchain places the same sources
# differently, v40 loop clk48 56.95 MHz locally vs 48.84 MHz here), so the published firmware
# can self-reflash the FPGA with exactly the gateware that passed on a bench.
#
# Publishes using the default GITHUB_TOKEN (contents: write below) — no
# separate PAT needed since source and release target are the same repo.
name: Release STM32 firmware

on:
  push:
    tags:
      - "stm32-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Public release tag to publish (e.g. v0.0.6)"
        required: true

# CUBE = STM32CubeH5 SDK version referenced in place by stm32h563/Makefile.
env:
  CUBE_VERSION: v1.6.0
  TARGET_REPO: embeddedci-com/benchpod-firmware

permissions:
  contents: write

jobs:
  build-and-release:
    # Don't run on forks — releases only belong to the canonical repo.
    if: github.repository == 'embeddedci-com/benchpod-firmware'
    runs-on: ubuntu-latest
    steps:
      # ubuntu-latest ships ~30GB of preinstalled Android/.NET/Haskell/etc that this
      # build never touches, leaving too little free space for the ESP-IDF Docker
      # image layers (multi-GB, submodules and all) — "no space left on device"
      # partway through `docker run`. Reclaim it before anything else runs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#stm32-}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing firmware as ${TARGET_REPO}@${TAG}"

      - name: Install host tools (xxd for the bitstream embed)
        run: sudo apt-get update && sudo apt-get install -y xxd

      - name: Set up ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Cache STM32CubeH5 SDK
        id: cube-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/STM32CubeH5
          key: stm32cubeh5-${{ env.CUBE_VERSION }}

      - name: Fetch STM32CubeH5 SDK
        if: steps.cube-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${CUBE_VERSION}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/STMicroelectronics/STM32CubeH5.git \
            "${{ runner.temp }}/STM32CubeH5"

      # The STM32 build .incbin's the ESP32-C3 esp-hosted slave image; it's a
      # vendored binary and intentionally not committed (gitignored *.bin), so a
      # fresh checkout must produce it first (stm32h563/Makefile, `fetch` target)
      # or the STM32 build fails loudly asking for exactly this. Cache it keyed on
      # the build recipe so only a recipe change re-runs the ESP-IDF Docker build.
      - name: Cache ESP32-C3 esp-hosted slave image
        id: esp-slave-cache
        uses: actions/cache@v6
        with:
          path: esp32-hosted-slave/prebuilt
          key: esp32c3-hosted-slave-${{ hashFiles('esp32-hosted-slave/build.sh', 'esp32-hosted-slave/sdkconfig.defaults*') }}

      - name: Build ESP32-C3 esp-hosted slave image
        if: steps.esp-slave-cache.outputs.cache-hit != 'true'
        run: make -C stm32h563 fetch

      # BOTH runtime images (image 0 = closed-loop, image 1 = deep DAC replay), exactly as they
      # passed on hardware (ice40/release/MANIFEST says how).  Fails the release if the gateware
      # sources changed since they were promoted: build, test on hardware, then
      # `make -C ice40 promote HW_VERIFIED="..."` and commit ice40/release/.
      - name: Install the hardware-verified iCE40 images (embedded by the firmware)
        run: make -C ice40 release-images

      - name: Build STM32 firmware
        run: make -C stm32h563 CUBE="${{ runner.temp }}/STM32CubeH5"

      - name: Check both gateware images are embedded
        run: |
          grep -q '#define FPGA_HAVE_IMAGES 1' stm32h563/build/fpga_bitstream.h || {
            echo "firmware embeds a single iCE40 image — expected loop + deep (make -C ice40 images)"
            exit 1
          }

      - name: Checksum
        working-directory: stm32h563/build
        run: |
          sha256sum bench_pod_stm32.bin | tee bench_pod_stm32.bin.sha256
          # which gateware this firmware embeds, and what hardware test it passed
          cp ../../ice40/release/MANIFEST ice40-gateware-MANIFEST.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        working-directory: stm32h563/build
        run: |
          ASSETS="bench_pod_stm32.bin bench_pod_stm32.bin.sha256 ice40-gateware-MANIFEST.txt"
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$TARGET_REPO" --clobber $ASSETS
          else
            gh release create "$TAG" --repo "$TARGET_REPO" \
              --title "STM32 bench-pod firmware $TAG" \
              --notes "Prebuilt STM32H563 bench-pod firmware. Flash with \`benchpod flash-self\` (or dfu-util)." \
              $ASSETS
          fi
