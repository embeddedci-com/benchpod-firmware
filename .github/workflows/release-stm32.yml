# Build the STM32H563 bench-pod firmware and publish the binary to the PUBLIC
# embeddedci-com/benchpod-firmware repo's releases, so `benchpod flash-self` can
# fetch a prebuilt image without anyone needing a toolchain or access to this
# (private) source repo.
#
# Trigger: push a tag like `stm32-v0.0.6` (the `stm32-` prefix is stripped for
# the public release tag, e.g. → `v0.0.6`), or run it manually with an explicit
# tag. The build embeds the real v2 iCE40 bitstream (built here), so the
# published firmware can also self-reflash the FPGA.
#
# Prerequisites (one-time, outside this file):
#   • the public repo `embeddedci-com/benchpod-firmware` must exist, and
#   • a secret `FIRMWARE_RELEASE_TOKEN` — a (fine-grained) PAT with
#     `contents: write` on benchpod-firmware — must be set on this repo/org.
#     The default GITHUB_TOKEN can't write to a different repo.
name: Release STM32 firmware

on:
  push:
    tags:
      - "stm32-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Public release tag to publish (e.g. v0.0.6)"
        required: true

# CUBE = STM32CubeH5 SDK version referenced in place by stm32h563/Makefile.
env:
  CUBE_VERSION: v1.6.0
  TARGET_REPO: embeddedci-com/benchpod-firmware

permissions:
  contents: read

jobs:
  build-and-release:
    # Don't run on forks — the release token only belongs to the canonical repo.
    if: github.repository == 'embeddedci-com/bench-pod-firmware'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#stm32-}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing firmware as ${TARGET_REPO}@${TAG}"

      - name: Install host tools (xxd for the bitstream embed)
        run: sudo apt-get update && sudo apt-get install -y xxd

      - name: Set up ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Set up OSS CAD Suite (yosys / nextpnr-ice40 / icestorm)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          # Pin to the yosys 0.65 toolchain the gateware timing is validated on (see test.yml).
          version: '2026-05-13'

      - name: Cache STM32CubeH5 SDK
        id: cube-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/STM32CubeH5
          key: stm32cubeh5-${{ env.CUBE_VERSION }}

      - name: Fetch STM32CubeH5 SDK
        if: steps.cube-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${CUBE_VERSION}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/STMicroelectronics/STM32CubeH5.git \
            "${{ runner.temp }}/STM32CubeH5"

      # BOTH runtime images (image 0 = closed-loop, image 1 = deep DAC replay) on their
      # pinned seeds — what pods run and what hardware verification covers.  The default `make`
      # target builds a single image, and the firmware then embeds only that one, so
      # fpga_image switching would not work on a released pod.
      - name: Build v2 iCE40 gateware images (embedded by the firmware)
        env:
          # Repository variable; unset/0 = a fallback seed or a clk48 below MIN_CLK48_MHZ warns
          # and the build continues, 1 = it fails the release (ice40/Makefile, PNR_STRICT).
          ICE40_PNR_STRICT: ${{ vars.ICE40_PNR_STRICT || '0' }}
        run: make -C ice40 images BOARD=vbench_pod PNR_STRICT="$ICE40_PNR_STRICT"

      - name: Build STM32 firmware
        run: make -C stm32h563 CUBE="${{ runner.temp }}/STM32CubeH5"

      - name: Check both gateware images are embedded
        run: |
          grep -q '#define FPGA_HAVE_IMAGES 1' stm32h563/build/fpga_bitstream.h || {
            echo "firmware embeds a single iCE40 image — expected loop + deep (make -C ice40 images)"
            exit 1
          }

      - name: Checksum
        working-directory: stm32h563/build
        run: sha256sum bench_pod_stm32.bin | tee bench_pod_stm32.bin.sha256

      - name: Publish to public firmware repo
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        working-directory: stm32h563/build
        run: |
          ASSETS="bench_pod_stm32.bin bench_pod_stm32.bin.sha256"
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$TARGET_REPO" --clobber $ASSETS
          else
            gh release create "$TAG" --repo "$TARGET_REPO" \
              --title "STM32 bench-pod firmware $TAG" \
              --notes "Prebuilt STM32H563 bench-pod firmware. Flash with \`benchpod flash-self\` (or dfu-util)." \
              $ASSETS
          fi
