# BenchPod features: the one source of truth for which firmware and gateware have which feature.
#
# The pod no longer announces every feature. It announces `features_rev` (BP_FEATURES_REV, the
# `revision` below, built in from this file), the running gateware, the running FPGA image and a
# few hardware facts; every client (SDK, MCP, CLI, server, web) looks the rest up here. Copies of
# features/features.json are bundled in each of them (their scripts/sync-feature-map.sh), so a
# pod works without a network connection.
#
# A client decides for a pod like this:
#   1. The pod sends features_rev: a feature is there when its `rev` <= features_rev, the running
#      gateware >= `gateware`, the board matches (`board`, default any) and every `requires`
#      fact holds.
#   2. No features_rev but a status `caps` list (older firmware): the list, as before.
#   3. Neither: the firmware version against `firmware` (the floor when it does not parse).
#
# Rules:
# - A new feature gets a new entry with `rev` = `revision` + 1, and `revision` goes up with it, in
#   the same pull request as the code. Two branches adding entries conflict on `revision`: merge
#   one, then renumber the other.
# - `firmware` is the first release with it, "next" until released. The release pull request
#   (the version.h bump) runs `tools/gen_features.py --release <version>`.
# - `gateware` is the lowest gateware version, checked against the RUNNING gateware; `gw_const`
#   names the firmware constant it equals (CI checks it).
# - Entries are never removed: one the firmware stopped having gets `status = "retired"`.
# - The status `caps` list is frozen: every name in it is an entry's `legacy_caps` or a fact's,
#   and no new name goes in (CI checks it). New features exist only here.
# - `floor` is the oldest firmware on a shipped pod (v3r1 boards, from 2026-10-19). Entries older
#   than that say the floor; `dated` says how the version was found: tag (the first release that
#   announced it), floor, or code (no flag; from the code or the docs).
# - Text is American English, no em-dashes, no chip part numbers (the docs show it).
#
# After an edit run `python3 tools/gen_features.py` (CI runs it with --check). It writes
# features/features.json (hosts) and stm32h563/src/bp_features.h (firmware).

schema = 1
revision = 7
floor = "3.9.2"
docs_base = "https://github.com/embeddedci-com/benchpod-firmware/blob/main/docs/"

# Facts the pod still announces, per pod or at runtime. `status` / `frame`: the field that has it
# (a top-level status field, or the cloud capabilities frame); `hw`: a name in the status `hw`
# list (the reply without `caps`); `legacy_caps`: its name in the old status `caps` list.
[facts.analog]
status = "analog"
frame = "analog"
legacy_caps = "analog"
note = "The board has the analog front end. A missing field means true (firmware before 3.6.0)."

[facts.nrst_pin]
status = "nrst_pin"
frame = "nrst_pin"
legacy_caps = "nrst_pin"
note = "The DUT reset pin (board rev3+)."

[facts.emu_image]
status = "sensors_digital"
frame = "sensors_digital"
note = "The sensor-emulation image is installed or running (gateware v54+)."

[facts.fpga_image]
status = "fpga_image"
frame = "fpga_image"
note = "The running FPGA image: loop, deep, emu or unknown. Required as fpga_image:<name>."

[facts.wifi]
hw = "wifi"
frame = "wifi_scan"
legacy_caps = "wifi_scan"
note = "A built-in Wi-Fi (ESP32-C3) or a Wi-Fi bridge."

[facts.usb_cc]
hw = "usb_cc"
legacy_caps = "usb_cc"
note = "The USB-C CC monitor (board rev3+)."

[facts.pod_current]
hw = "pod_current"
frame = "pod_current"
legacy_caps = "pod_current"
note = "The pod's own current monitor."

[facts.adc_low_range]
hw = "adc_low_range"
frame = "adc_low_range"
legacy_caps = "adc_low_range"
note = "The ADC low range (analog module v3r4+)."

[facts.vref_out]
hw = "vref_out"
note = "J1 pin 21 is switched and measured, and 5 V I/O exists (digital board v3r4+). Older boards never announce it."

